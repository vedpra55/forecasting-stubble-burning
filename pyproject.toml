[project]
name = "stubblecast"
version = "0.1.0"
description = "Week-ahead stubble-burning forecasts for Punjab from satellite data"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.4",
    "google-auth>=2.30",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "shapely>=2.0",
    "pyproj>=3.7.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stubblecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
