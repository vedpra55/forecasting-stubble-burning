# Dataset IDs and API endpoints. Verified 2026-11-04; see reports/metrics/verify_*.json.
gee:
  s2: COPERNICUS/S2_SR_HARMONIZED
  cloud_score_plus: GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED
  cloud_score_band: cs_cdf
  cloud_score_threshold: 0.60     # catalog guidance: 0.50-0.65
  s1: COPERNICUS/S1_GRD
  worldcover: ESA/WorldCover/v200
  era5_land_daily: ECMWF/ERA5_LAND/DAILY_AGGR
  era5_bands: [temperature_2m, dewpoint_temperature_2m, u_component_of_wind_10m,
               v_component_of_wind_10m, total_precipitation_sum, surface_pressure]
firms:
  # Public yearly per-country CSVs (no key needed). NOAA-20 is filed as "viirs-jpss1".
  yearly_country_url: https://firms.modaps.eosdis.nasa.gov/data/country/{folder}/{year}/{folder}_{year}_{country}.csv
  sensors:
    viirs_noaa20: {folder: viirs-jpss1, instrument: VIIRS}
    viirs_snpp: {folder: viirs-snpp, instrument: VIIRS}
    modis: {folder: modis, instrument: MODIS}
  area_api_url: https://firms.modaps.eosdis.nasa.gov/api/area/csv/{key}/{source}/{bbox}/{days}/{date}
  area_api_max_days: 5
  # S-NPP science data delivery ended 2026-11-02 (NOAA NESDIS notice).
  snpp_end_date: "2026-11-02"
openaq:
  base_url: https://api.openaq.org/v3
  auth_header: X-API-Key
# Geostationary imagers considered for measuring polar-orbiter fire miss rates (D-004).
# sub_lon: sub-satellite longitude (deg E). ir_nadir_km: nadir sampling of the ~3.9 um band.
# repeat_min: full-disk (or India-sector) repeat cycle. Values from operator pages (2026-11).
geostationary:
  target_point: {name: Punjab centroid (approx), lat: 30.8, lon: 75.4}
  satellites:
    insat_3dr:   {label: INSAT-3DR Imager,  sub_lon: 74.0,  ir_nadir_km: 4.0, repeat_min: 30}
    insat_3ds:   {label: INSAT-3DS Imager,  sub_lon: 82.0,  ir_nadir_km: 4.0, repeat_min: 30}
    meteosat_9:  {label: "Meteosat-9 SEVIRI (IODC, since 2022-06)", sub_lon: 45.5, ir_nadir_km: 3.0, repeat_min: 15}
    meteosat_8:  {label: "Meteosat-8 SEVIRI (IODC, until 2022-06)", sub_lon: 41.5, ir_nadir_km: 3.0, repeat_min: 15}
    gk2a:        {label: GK2A AMI,          sub_lon: 128.2, ir_nadir_km: 2.0, repeat_min: 10}
    himawari_9:  {label: Himawari-9 AHI,    sub_lon: 140.7, ir_nadir_km: 2.0, repeat_min: 10}
